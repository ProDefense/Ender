services:
  operator:
    build:
      context: .
      dockerfile: Dockerfile
    image: ender
    container_name: operator
    hostname: operator
    stdin_open: true
    tty: true
    ports:
      - "80:80"
      - "4444:4444"
      - "8080:8080"
      - "55552:55552"
      - "55553:55553"
    environment:
      - RPCPASS=memes
      - RPCPORT=1337
    volumes:
      - ./src/config_files/msfconsole.rc:/usr/src/metasploit-framework/docker/msfconsole.rc:ro
      - sliver-data:/opt/sliver
      - sliver-server-conf:/root/.sliver
      - sliver-client-conf:/root/.sliver-client
    networks:
      localnet:
        ipv4_address: 10.1.1.2

  metasploitable2:
    image: tleemcjr/metasploitable2
    container_name: metasploitable2
    hostname: metasploitable2
    entrypoint: bash -c '/bin/services.sh && tail -f /dev/null'
    command: sleep infinite
    networks:
      localnet:
        ipv4_address: 10.1.1.3

  windows:
    image: dockurr/windows
    container_name: windows
    hostname: windows
    environment:
      - VERSION=7e # Windows 7 Enterprise (lighter than Windows 10)
      - RAM_SIZE=2G # Reduced for VM
      - CPU_CORES=1 # Reduced for VM
      - USERNAME=Docker
      - PASSWORD=admin
      - DISK_SIZE=32G # Reduced to save space
      - ARGUMENTS=-accel tcg,thread=multi -netdev user,id=net0 -device e1000,netdev=net0 # TCG + user-mode networking
    ports:
      - "8007:8006" # Web interface (changed to avoid conflicts)
      - "3389:3389" # RDP
    volumes:
      - windows-storage:/storage
    stop_grace_period: 5m # Increased for clean shutdown
    restart: unless-stopped # Auto-restart on crash
    networks:
      localnet:
        ipv4_address: 10.1.1.4

networks:
  localnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.1.0/24
          gateway: 10.1.1.1

volumes:
  sliver-data:
  sliver-server-conf:
  sliver-client-conf:
  windows-storage: